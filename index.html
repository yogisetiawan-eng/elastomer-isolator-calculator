<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Isolator Design Calculator</title>
<style>html,body{margin:0;min-height:100%;background:#0a1622;color:#b9cddf;font-family:system-ui,sans-serif}.loading{padding:28px}</style>
</head>
<body><div class="loading">Loading Isolator Design Calculator…</div>
<script>
(async()=>{
  const r=await fetch('./app.html',{cache:'no-store'});
  if(!r.ok) throw new Error(`Failed to load calculator (${r.status})`);
  let html=await r.text();
  const patch='<script src="./linear-patch.js?v=20260909"></scr'+'ipt><script src="./experiment-correction.js?v=20260909"></scr'+'ipt>';
  html=html.replace(/<\/body>/i,patch+'</body>');
  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  document.body.innerHTML='<div class="loading"><strong>Calculator failed to load.</strong><br>'+String(err)+'</div>';
});
</script>
</body>
</html>
